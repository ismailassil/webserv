server {
    listen ;
    server_name example.com;
    error_pages 404 /404.html 403 403.html;
    client_max_body_size 1M;
    location / {
        root /var/www/html;
        index index.html;
    }
    location /upload {
        root /var/www/uploads;
        methods POST;
    }
    location /cgi-bin {
        root /usr/lib/cgi-bin;
        cgi .php;
    }
}

